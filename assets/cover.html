<title>vault-radar — watch your coding agent read</title>
<style>
  :root {
    --bg:      #12100e;
    --edge:    #38312a;
    --dim:     #4b453d;
    --amber:   #e3b341;
    --orange:  #c9662e;
    --ember:   #ff7a45;
    --peach:   #ffd8bd;
    --peach-2: #ffb08a;
    --ink:     #ece4d9;
    --ink-2:   #9a9086;
    --ink-3:   #6b635a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
            "DejaVu Sans Mono", "Liberation Mono", monospace;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", Times, serif;
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; overflow:hidden; background:var(--bg); }

  .cover {
    position:relative; width:1280px; height:640px; overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:var(--mono); -webkit-font-smoothing:antialiased;
  }

  /* --- ground ------------------------------------------------------ */
  .grain, .glow, .vig { position:absolute; inset:0; pointer-events:none; }
  .grain {
    background-image:radial-gradient(circle, #3a332b 1px, transparent 1.2px);
    background-size:26px 26px; opacity:.16;
  }
  .glow {
    background:
      radial-gradient(560px 380px at 61% 61%, rgba(201,102,46,.16), transparent 70%),
      radial-gradient(700px 460px at 24% 22%, rgba(227,179,65,.06), transparent 72%);
  }
  .vig {
    background:radial-gradient(124% 96% at 50% 47%, transparent 47%, rgba(6,5,4,.6) 100%);
  }

  /* --- graph ------------------------------------------------------- */
  svg.graph { position:absolute; inset:0; width:1280px; height:640px; display:block; }

  .e  { fill:none; stroke:var(--edge); stroke-width:1.25; }
  .bn { fill:var(--dim); }

  .tr { fill:none; stroke:var(--ember); stroke-width:2.1; stroke-linecap:round;
         stroke-dasharray:100 100; filter:url(#soft); }
  .cm { fill:none; stroke:var(--peach); stroke-width:3.4; stroke-linecap:round;
         stroke-dasharray:9 100; filter:url(#soft); }
  .st { filter:url(#soft); }
  .halo { fill:none; stroke:var(--peach-2); stroke-width:1.6; }
  .sw { fill:none; stroke:var(--amber); stroke-width:1.4; }

  .tr,.cm,.st,.halo,.sw {
    animation-duration:6s; animation-iteration-count:infinite;
    animation-timing-function:linear; animation-fill-mode:both;
  }
  .cm { animation-timing-function:cubic-bezier(.42,0,.58,1); }

  .lb {
    font-family:var(--mono); font-size:12.5px; fill:var(--ink-2);
    letter-spacing:.02em;
    paint-order:stroke fill; stroke:var(--bg); stroke-width:3.5px;
    stroke-linejoin:round;
    animation:lbin 6s linear infinite both;
  }

  /* --- title block ------------------------------------------------- */
  .brand { position:absolute; left:58px; top:50px; width:472px; }
  .brand h1 {
    margin:0; font-family:var(--mono); font-size:38px; font-weight:600;
    letter-spacing:-.022em; color:var(--ink);
  }
  .brand h1 .dot { color:var(--ember); }
  .brand .rule {
    width:74px; height:2px; margin:15px 0 14px;
    background:linear-gradient(90deg, var(--ember), rgba(255,122,69,0));
  }
  .brand p {
    margin:0; font-family:var(--serif); font-size:18.5px; line-height:1.45;
    color:var(--ink); opacity:.92; letter-spacing:.004em; white-space:nowrap;
  }

  .legend { display:flex; gap:17px; margin-top:24px; flex-wrap:nowrap; }
  .legend span {
    display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-3); white-space:nowrap;
  }
  .legend i { width:7px; height:7px; border-radius:50%; display:block; }
  .k0 { background:var(--dim); }
  .k1 { background:var(--amber); }
  .k2 { background:var(--orange); }
  .k3 { background:var(--peach); box-shadow:0 0 0 3px rgba(255,176,138,.22); }

  /* --- counter card ------------------------------------------------ */
  .card {
    position:absolute; right:52px; bottom:44px; width:286px;
    padding:15px 17px 16px;
    background:rgba(20,17,14,.9);
    border:1px solid #2f2921; border-radius:9px;
    box-shadow:0 14px 40px rgba(0,0,0,.5);
  }
  .card .tag {
    font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-3); margin-bottom:11px;
  }
  .card .row {
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; color:var(--ink-2); padding:2.5px 0;
  }
  .card .row b { font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .card .row.read b { color:var(--orange); }
  .card .sep { height:1px; background:#2f2921; margin:11px 0 10px; }
  .card .big { display:flex; align-items:baseline; gap:10px; }
  .card .big .num {
    font-size:27px; font-weight:600; color:var(--peach);
    letter-spacing:-.02em; white-space:nowrap;
  }
  .card .big .note { flex:1; font-size:11.5px; line-height:1.35; color:var(--ink-3); }
